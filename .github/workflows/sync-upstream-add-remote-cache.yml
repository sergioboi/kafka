name: Sync Upstream And Build add-remote-cache

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */3 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: apache/kafka
  UPSTREAM_BRANCH: trunk
  TARGET_BRANCH: add-remote-cache

jobs:
  sync:
    name: Merge upstream trunk into add-remote-cache
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge upstream trunk into add-remote-cache
        id: sync
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/$UPSTREAM_REPOSITORY.git"
          else
            git remote add upstream "https://github.com/$UPSTREAM_REPOSITORY.git"
          fi

          git fetch --no-tags --prune origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          git fetch --no-tags --prune upstream \
            "+refs/heads/$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"

          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "No upstream changes to apply."
            echo "branch-updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --no-edit "upstream/$UPSTREAM_BRANCH"
          git push origin "$TARGET_BRANCH:$TARGET_BRANCH"

          echo "branch-updated=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch build workflow
        if: ${{ steps.sync.outputs.branch-updated == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build.yml \
            --ref "$TARGET_BRANCH" \
            -f is-trunk=false \
            -f is-public-fork=true
