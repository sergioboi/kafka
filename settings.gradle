project(":storage:api").name = "storage-api"
rootProject.name = 'kafka'

buildCache {
    local {
        enabled = false
    }

    remote(HttpBuildCache) {
        // On CI it's easiest to provide Env Vars
        // On local macOS it's easier to provide ~/.gradle/gradle.properties for consistency between Terminal & IDE
        def remoteUrl = System.getenv('KAFKA_GRADLE_REMOTE_CACHE_URL') ?:
                providers.gradleProperty('KAFKA_GRADLE_REMOTE_CACHE_URL').orNull

        def user = System.getenv('KAFKA_GRADLE_REMOTE_CACHE_USER') ?:
                providers.gradleProperty('KAFKA_GRADLE_REMOTE_CACHE_USER').orNull

        def token = System.getenv('KAFKA_GRADLE_REMOTE_CACHE_TOKEN') ?:
                providers.gradleProperty('KAFKA_GRADLE_REMOTE_CACHE_TOKEN').orNull

        if (remoteUrl != null && user != null && token != null) {
            enabled = true

            url = uri(remoteUrl.trim())

            credentials {
                username = user.trim()
                password = token.trim()
            }

            push = true
        } else {
            enabled = false
        }
    }
}
